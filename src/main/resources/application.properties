spring.application.name=notificationservice
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/fintech_notification_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# kafka consumer configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.notificationservice.kafka.dto
# logical type id -> local class; must match the ids used by the producers. Comma-separate additional entries
spring.kafka.consumer.properties.spring.json.type.mapping=userRegistration:com.example.notificationservice.kafka.dto.UserRegistrationEvent
